<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background hijau dengan rounded corners -->
  <rect width="100" height="100" fill="#16a34a" rx="15"/>
  
  <!-- Warehouse icon putih -->
  <g fill="white" stroke="white">
    <!-- Atap/Roof -->
    <path d="M 25 45 L 50 30 L 75 45 Z" fill="white"/>
    
    <!-- Bangunan utama -->
    <rect x="25" y="45" width="50" height="35" fill="white"/>
    
    <!-- Pintu garasi dengan garis horizontal (seperti rolling door) -->
    <rect x="32" y="52" width="36" height="25" fill="#16a34a"/>
    
    <!-- Garis horizontal pintu garasi -->
    <line x1="32" y1="56" x2="68" y2="56" stroke="white" stroke-width="1.5"/>
    <line x1="32" y1="60" x2="68" y2="60" stroke="white" stroke-width="1.5"/>
    <line x1="32" y1="64" x2="68" y2="64" stroke="white" stroke-width="1.5"/>
    <line x1="32" y1="68" x2="68" y2="68" stroke="white" stroke-width="1.5"/>
    <line x1="32" y1="72" x2="68" y2="72" stroke="white" stroke-width="1.5"/>
  </g>
</svg>
