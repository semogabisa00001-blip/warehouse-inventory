<!DOCTYPE html>
<html>
<head>
    <title>Generate Favicon</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f3f4f6;
            font-family: system-ui;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        canvas {
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }
        button {
            background: #16a34a;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            margin: 0.5rem;
        }
        button:hover {
            background: #15803d;
        }
        .instructions {
            margin-top: 1rem;
            padding: 1rem;
            background: #f0fdf4;
            border-radius: 0.5rem;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mini Warehouse Favicon Generator</h1>
        <canvas id="canvas" width="512" height="512"></canvas>
        <div>
            <button onclick="downloadPNG()">Download PNG (512x512)</button>
            <button onclick="downloadICO()">Download ICO</button>
        </div>
        <div class="instructions">
            <h3>Instructions:</h3>
            <ol>
                <li>Click "Download PNG" to get the 512x512 image</li>
                <li>Go to <a href="https://favicon.io/favicon-converter/" target="_blank">favicon.io/favicon-converter/</a></li>
                <li>Upload the PNG file</li>
                <li>Download the generated favicon.ico</li>
                <li>Place favicon.ico in the public/ folder</li>
                <li>Restart your dev server</li>
            </ol>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Draw favicon
        function drawFavicon() {
            // Background hijau rounded
            ctx.fillStyle = '#16a34a';
            roundRect(ctx, 0, 0, 512, 512, 80);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'white';

            // Atap/Roof (segitiga)
            ctx.beginPath();
            ctx.moveTo(128, 230);  // kiri
            ctx.lineTo(256, 150);  // puncak
            ctx.lineTo(384, 230);  // kanan
            ctx.closePath();
            ctx.fill();

            // Bangunan utama (persegi)
            ctx.fillRect(128, 230, 256, 180);

            // Pintu garasi (hijau)
            ctx.fillStyle = '#16a34a';
            ctx.fillRect(164, 265, 184, 130);

            // Garis horizontal pintu garasi (rolling door effect)
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 8;
            for (let i = 0; i < 6; i++) {
                const y = 280 + (i * 20);
                ctx.beginPath();
                ctx.moveTo(164, y);
                ctx.lineTo(348, y);
                ctx.stroke();
            }
        }

        // Helper function untuk rounded rectangle
        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        drawFavicon();

        function downloadPNG() {
            const link = document.createElement('a');
            link.download = 'mini-warehouse-favicon.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadICO() {
            alert('Please use the PNG download and convert it at favicon.io/favicon-converter/');
        }
    </script>
</body>
</html>
